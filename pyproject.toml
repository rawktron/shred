[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shred"
version = "0.1.0"
description = "A tiny no-bullshit static site generator: Markdown, TOML frontmatter, and Jinja2."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "Jinja2==3.1.6",
    "mistune==3.2.0",
]

[project.scripts]
shred = "shred.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shred = ["skills/shred-content-author/SKILL.md"]
