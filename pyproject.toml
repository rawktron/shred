[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yas"
version = "0.1.0"
description = "Yet Another static site generator: Markdown, TOML frontmatter, and Jinja2."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Jinja2==3.1.6",
    "mistune==3.2.0",
]

[project.scripts]
yas = "yas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yas = ["skills/yas-content-author/SKILL.md"]
